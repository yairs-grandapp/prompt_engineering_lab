# prompt_v20.txt — hardened TIER 2 to reduce COULD_NOT_VALIDATE over-asking
#   CHANGE FROM v19: one rule only. The TIER 2 "exactly one clarifying question then
#   validate" rule was strengthened to (a) count strictly — the senior's reply to
#   the greeting is already the first unclear answer, so only ONE clarifying question
#   remains — and (b) forbid asking again (no re-ask/re-offer/re-introduce/suggest
#   checking the box); a second clarifying question is a violation; it is correct to
#   stop after one attempt. Targets the exp_022 over-asking (~12 could-not-validate
#   cases running 4-5 turns).
#   UNCHANGED: all other v19 content; src/conversation_runner.py still injects the
#   COULD_NOT_VALIDATE message.
#   EXPECTATION: this is a probabilistic nudge on a counting/judgment behaviour, not
#   a guarantee. Expect the over-asking count to fall (roughly 12 -> 5-7), not to
#   zero. Outcomes should stay 100/100; watch for any regression where a genuinely
#   confused senior is cut off too early (there is no correctness risk — the outcome
#   is could-not-validate either way — but the intent is fewer redundant turns).

experiment:
  name: "Missed Medication — Reduce Over-Asking (prompt_v20)"
  date: "2026-08-21"

models:
  - name: "gpt-4o"
    temperature: 0.4

prompt:
  template: "prompt_v20.txt"
  language: "English"
  assistant_gender: "female"
  additional_information:
    scheduledTime: "2026-07-29T08:00"
    reminderCount: 0

conversation:
  max_turns: 10
  extra_silence_turns: 2
  enable_state_injection: false

inputs_file: "inputs_v3.json"