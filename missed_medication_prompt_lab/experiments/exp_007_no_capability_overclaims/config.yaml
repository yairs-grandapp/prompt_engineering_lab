# prompt_v6.txt — no capability overclaims (presence + conversational)
#   CHANGES FROM v5:
#   1. Added a [DOMAIN] guardrail against PRESENCE overclaims. Vega makes a
#      brief reminder call and cannot wait on the line, stay present, listen,
#      watch, monitor, or confirm in real time that the senior takes the
#      medication. Bans phrases like "I can wait while you do", "I'll stay on
#      the line", "I'll check back later".
#      Targets the "I can wait while you do" line seen in exp_006 scenario_02.
#   2. Extended that guardrail to CONVERSATIONAL / counseling overclaims. Vega
#      is not a counselor and the call ends after the reminder, so it must not
#      invite the senior to explain their reasons or "talk it through", nor
#      imply ongoing availability. Bans phrases like "we can talk about it",
#      "tell me why", "I'm here to support you", "we can discuss it further".
#   3. Reworded the scripted Message #2 (refusal) to drop the "please tell me
#      your reasons, and we can talk about it calmly" invitation, so the
#      scripted message no longer contradicts the guardrail.
#   No outcome/flow logic changes; only tone/scope guardrails and Message #2.

experiment:
  name: "Missed Medication — No Capability Overclaims (prompt_v5)"
  date: "2026-08-12"

models:
  - name: "gpt-4o"
    temperature: 0.4

prompt:
  template: "prompt_v6.txt"
  language: "English"
  assistant_gender: "female"
  additional_information:
    scheduledTime: "2026-07-29T08:00"
    reminderCount: 0

conversation:
  max_turns: 10
  extra_silence_turns: 2
  enable_state_injection: false

inputs_file: "inputs_v1.json"
